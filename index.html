<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Playwrite+DE+Grund:wght@100..400&family=Playwrite+NZ:wght@200&family=Sarabun:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap"
            rel="stylesheet">
        <link rel='stylesheet'
            href='https://cdn-uicons.flaticon.com/2.1.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
        <link rel="stylesheet" href="style.css">
        <title>Air Quality</title>
    </head>
    <body>
        <div class="cont background">

            <p class="date">
                Monday , December 12
            </p>

            <h1 class="city" id="cityName">
                Kochi
            </h1>

            <div class="data-cont">

                <div class="aqi-cont aqi-cont-common">
                    <p class="aqi-head">AQI</p>
                    <p class="aqi" id="aqiValue">4</p>
                    <p class="cond">
                        Good
                    </p>
                </div>

                <div class="w-cont aqi-cont-common">
                    <p class="aqi-head w-head">Weather</p>
                    <div class="w-split">
                        <div class="w-left">
                            <p class="aqi weather" id="weatherValue">29°c</p>
                            <p class="w-feel">Feels Like <span
                                    id="feelsLike">26°c</span>
                            </p>
                        </div>
                        <div class="w-right">
                            <div class="w-img">
                                <i class="fa-solid fa-cloud"></i>
                            </div>
                            <p class="cond w-cond" id="weatherCondition">
                                Clear
                            </p>
                        </div>
                    </div>
                </div>

            </div>

            <div class="comp-cont">
                <div class="a-left">
                    <div class="a-left-top">
                        <div class="ph-1"><span class="ph-head">ph : </span>
                            <span class="ph-val" id="phValue1">
                                2345</span></div>
                        <div class="ph-2"><span class="ph-head">ph : </span>
                            <span class="ph-val" id="phValue1">
                                2345</span></div>
                    </div>
                    <div class="a-left-bottom">
                        <div class="a-left-bottom-top">
                            <div class="a-comp"><span class="comp-head"> Carbon
                                    Monoxide </span><span
                                    class="comp-val" id="co">560</span></div>
                            <div class="a-comp"><span class="comp-head"> Nitric
                                    Acid </span><span
                                    class="comp-val" id="no">0</span></div>
                            <div class="a-comp"><span class="comp-head">
                                    Nitrogen Dioxide </span><span
                                    class="comp-val" id="no2">7.71</span></div>
                            <div class="a-comp"><span
                                    class="comp-head" id="o3">Trioxygen
                                </span><span
                                    class="comp-val">114</span></div>
                            <div class="a-comp"><span class="comp-head"> Sulfur
                                    Dioxide </span><span
                                    class="comp-val" id="so2">6.97</span></div>
                            <div class="a-comp"><span class="comp-head"> Ammoia
                                </span><span class="comp-val"
                                    id="nh3">13</span></div>
                        </div>
                    </div>
                </div>
                <div class="a-right">
                    <div class="w-right-top">
                        <div class="w-comp"><span
                                class="w-comp-head">Humidity</span><span
                                class="w-comp-val"
                                id="humidity">80%</span></div>
                        <div class="w-comp"><span class="w-comp-head">Wind
                                Speed</span><span
                                class="w-comp-val" id="windSpeed">24
                                <span>kmph</span> </span></div>
                    </div>
                    <div class="a-right-bottom"></div>
                </div>
            </div>

        </div>
        <script src="https://kit.fontawesome.com/aed879640d.js"
            crossorigin="anonymous"></script>
        <script src="app.js"></script>
    </body>
</html>
